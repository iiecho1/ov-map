<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最近点匹配</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #222240;
  --border: #2a2a4a;
  --text: #d4d4e8;
  --text-muted: #8888aa;
  --text-dim: #5c5c7a;
  --accent: #7c8cf8;
  --accent-hover: #9aa8ff;
  --success: #4ade80;
  --success-hover: #6ee7a0;
  --danger: #f87171;
  --danger-hover: #fca5a5;
  --warning: #fbbf24;
  --warning-hover: #fcd34d;
  --radius: 10px;
  --radius-sm: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  font-size: 13px;
  line-height: 1.5;
}

.app {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.5);
}

.header {
  background: linear-gradient(135deg, #1e1e3a 0%, #1a1a2e 100%);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}

.header .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), #c084fc);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #fff;
  font-weight: bold;
}

.header h1 { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
.header .ver { font-size: 10px; color: var(--text-dim); margin-left: auto; }
.header .nav-link {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: all .2s;
}
.header .nav-link:hover { background: var(--surface2); border-color: var(--accent); }

.content { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

.card {
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: border-color .2s;
}

.card-header {
  padding: 10px 16px;
  background: rgba(0,0,0,.15);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: .2px;
}

.card-header .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.card-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.row { display: flex; align-items: center; gap: 10px; }
.row label { min-width: 52px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.row > * + * { flex: 1; }

input[type="text"], input[type="number"], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  font-family: inherit;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,140,248,.12);
}
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238888aa' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; }
select option { background: var(--surface); }

.file-zone {
  position: relative;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  background: rgba(124,140,248,.03);
}
.file-zone:hover {
  border-color: var(--accent);
  background: rgba(124,140,248,.07);
}
.file-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1;
}
.file-zone .icon { font-size: 32px; display: block; margin-bottom: 6px; opacity: .8; pointer-events: none; }
.file-zone .hint { font-size: 12px; color: var(--text-muted); pointer-events: none; }
.file-zone .hint strong { color: var(--accent); }
.file-zone.loaded { border-color: var(--success); border-style: solid; }
.file-zone.loaded .icon::after { content: " ✅"; font-size: 16px; }

.btn {
  padding: 7px 16px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1px;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.btn:active { transform: scale(.97); }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }

.btn-success { background: #166534; color: #bbf7d0; }
.btn-success:hover { background: #15803d; }

.btn-danger { background: #7f1d1d; color: #fecaca; }
.btn-danger:hover { background: #991b1b; }

.btn-warning { background: #451a03; color: #fde68a; }
.btn-warning:hover { background: #78350f; }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }

.btn-sm { padding: 4px 10px; font-size: 11px; }

.file-info { margin-top: 4px; font-size: 11px; color: var(--accent); font-weight: 500; }

.match-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 0;
}

.match-bar .btn { padding: 10px 32px; font-size: 14px; }

.match-bar label { min-width: auto; font-size: 13px; }
.match-bar input[type="number"] { width: 60px; text-align: center; }

.result-section {
  max-height: 600px;
  overflow: auto;
}

.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.result-table th, .result-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}

.result-table th {
  background: rgba(0,0,0,.2);
  color: var(--text-muted);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .3px;
  position: sticky;
  top: 0;
  z-index: 1;
}

.result-table tr:hover td { background: rgba(124,140,248,.05); }

.result-table .col-source { color: var(--accent); font-weight: 500; }
.result-table .col-match { color: var(--success); }
.result-table .col-dist { color: var(--warning); font-family: "JetBrains Mono", "Consolas", monospace; }

.result-summary {
  padding: 10px 16px;
  background: rgba(0,0,0,.15);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}

.status-bar {
  padding: 10px 28px;
  background: rgba(0,0,0,.2);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-bar .separator { flex: 1; }
.status-bar .dot-status {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

.loading-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,15,26,.85);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-muted); }

.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  background: rgba(124,140,248,.15);
  color: var(--accent);
}

.full-width { width: 100%; }
.text-center { text-align: center; }

@media (max-width: 768px) {
  body { padding: 12px; }
  .app { border-radius: 12px; }
  .content { padding: 16px 14px; gap: 14px; }
  .card-body { padding: 12px; }
  .match-bar { flex-direction: column; }
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">📍</div>
    <h1>最近点匹配</h1>
    <span class="ver">Nearest Point Matcher</span>
    <a href="/" class="nav-link">返回地图</a>
  </div>

  <div class="content">

    <div class="card">
      <div class="card-header">
        <span class="dot"></span> 表格1（基准地点）
      </div>
      <div class="card-body">
        <div class="file-zone" id="zone1">
          <input type="file" id="fileInput1" accept=".xlsx,.xls,.csv" />
          <span class="icon">📂</span>
          <span class="hint">点击或拖拽 <strong>Excel / CSV</strong> 文件</span>
        </div>
        <div class="file-info" id="fileInfo1"></div>
        <div class="row" id="sheetRow1" style="display:none"><label>数据源</label><select id="sheetSelect1"></select></div>
        <div class="row" id="nameRow1" style="display:none"><label>名称</label><select id="nameCol1"></select></div>
        <div class="row" id="lngRow1" style="display:none"><label>经度</label><select id="lngCol1"></select></div>
        <div class="row" id="latRow1" style="display:none"><label>纬度</label><select id="latCol1"></select></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="dot" style="background:var(--success)"></span> 表格2（候选地点）
      </div>
      <div class="card-body">
        <div class="file-zone" id="zone2">
          <input type="file" id="fileInput2" accept=".xlsx,.xls,.csv" />
          <span class="icon">📂</span>
          <span class="hint">点击或拖拽 <strong>Excel / CSV</strong> 文件</span>
        </div>
        <div class="file-info" id="fileInfo2"></div>
        <div class="row" id="sheetRow2" style="display:none"><label>数据源</label><select id="sheetSelect2"></select></div>
        <div class="row" id="nameRow2" style="display:none"><label>名称</label><select id="nameCol2"></select></div>
        <div class="row" id="lngRow2" style="display:none"><label>经度</label><select id="lngCol2"></select></div>
        <div class="row" id="latRow2" style="display:none"><label>纬度</label><select id="latCol2"></select></div>
      </div>
    </div>

    <div class="card" id="matchCard" style="display:none">
      <div class="card-body">
        <div class="match-bar">
          <label>每个基准点匹配最近</label>
          <input type="number" id="topN" value="3" min="1" max="100" />
          <label>个候选点</label>
          <button class="btn btn-primary" id="btnMatch">开始匹配</button>
          <button class="btn btn-success" id="btnExport" style="display:none">导出结果</button>
        </div>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="card-header">
        <span class="dot" style="background:var(--success)"></span> 匹配结果
        <span id="resultCount" style="font-size:10px;color:var(--text-dim);margin-left:8px"></span>
      </div>
      <div class="card-body result-section" id="resultBody"></div>
      <div class="result-summary" id="resultSummary"></div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot-status"></span>
    <span id="statusLeft">就绪</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span class="loading-text">正在匹配...</span>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

let wb1 = null, wb2 = null;
let headers1 = [], data1 = [];
let headers2 = [], data2 = [];
let matchResults = [];

function autoSelect(sel, keywords) {
  for (const kw of keywords) {
    const found = [...sel.options].find(o => o.value.toLowerCase().includes(kw.toLowerCase()));
    if (found) { sel.value = found.value; return; }
  }
}

function parseSheet(wb, sheetName) {
  const ws = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
  if (json.length < 2) return null;
  const headers = json[0].map(h => String(h).trim());
  const rows = json.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i] !== undefined ? row[i] : '');
    return obj;
  });
  return { headers, rows };
}

function populateSelect(sel, headers, keywords) {
  sel.innerHTML = '';
  headers.forEach(h => {
    const opt = document.createElement('option');
    opt.value = h; opt.textContent = h;
    sel.appendChild(opt);
  });
  if (keywords) autoSelect(sel, keywords);
}

function showMapping(idx, wb, sheetNames, headers, rows) {
  const sheetRow = $('sheetRow' + idx);
  const sheetSel = $('sheetSelect' + idx);

  if (sheetNames.length > 0) {
    sheetRow.style.display = '';
    sheetSel.innerHTML = '';
    sheetNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sheetSel.appendChild(opt);
    });
  }

  ['nameRow','lngRow','latRow'].forEach(id => $(id + idx).style.display = '');

  const nameKw = ['名称', 'name', 'label', '站点名', '基站名称'];
  const lngKw = ['Longitude', '经度', 'lng', 'longitude', 'lon'];
  const latKw = ['Latitude', '纬度', 'lat', 'latitude'];

  populateSelect($('nameCol' + idx), headers, nameKw);
  populateSelect($('lngCol' + idx), headers, lngKw);
  populateSelect($('latCol' + idx), headers, latKw);

  if (idx === 1) { headers1 = headers; data1 = rows; }
  else { headers2 = headers; data2 = rows; }

  checkBothLoaded();
}

function loadSheetFor(idx, wb, sheetName) {
  const result = parseSheet(wb, sheetName);
  if (!result) { alert('该工作表数据不足'); return; }

  const nameCol = $('nameCol' + idx);
  const lngCol = $('lngCol' + idx);
  const latCol = $('latCol' + idx);
  const curName = nameCol.value, curLng = lngCol.value, curLat = latCol.value;

  populateSelect(nameCol, result.headers, null);
  populateSelect(lngCol, result.headers, null);
  populateSelect(latCol, result.headers, null);

  if (result.headers.includes(curName)) nameCol.value = curName;
  else autoSelect(nameCol, ['名称', 'name', 'label', '站点名', '基站名称']);
  if (result.headers.includes(curLng)) lngCol.value = curLng;
  else autoSelect(lngCol, ['Longitude', '经度', 'lng', 'longitude', 'lon']);
  if (result.headers.includes(curLat)) latCol.value = curLat;
  else autoSelect(latCol, ['Latitude', '纬度', 'lat', 'latitude']);

  if (idx === 1) { headers1 = result.headers; data1 = result.rows; }
  else { headers2 = result.headers; data2 = result.rows; }

  checkBothLoaded();
}

$('fileInput1').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  $('fileInfo1').textContent = '✅ ' + file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
  $('zone1').classList.add('loaded');
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在导入表格1...';
  overlay.classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    setTimeout(() => {
      wb1 = XLSX.read(ev.target.result, { type: 'array' });
      const result = parseSheet(wb1, wb1.SheetNames[0]);
      overlay.classList.remove('show');
      if (!result) { alert('文件数据不足'); return; }
      showMapping(1, wb1, wb1.SheetNames, result.headers, result.rows);
    }, 30);
  };
  reader.readAsArrayBuffer(file);
});

$('sheetSelect1').addEventListener('change', e => {
  if (!wb1) return;
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在加载工作表...';
  overlay.classList.add('show');
  setTimeout(() => {
    loadSheetFor(1, wb1, e.target.value);
    overlay.classList.remove('show');
  }, 30);
});

$('fileInput2').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  $('fileInfo2').textContent = '✅ ' + file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
  $('zone2').classList.add('loaded');
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在导入表格2...';
  overlay.classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    setTimeout(() => {
      wb2 = XLSX.read(ev.target.result, { type: 'array' });
      const result = parseSheet(wb2, wb2.SheetNames[0]);
      overlay.classList.remove('show');
      if (!result) { alert('文件数据不足'); return; }
      showMapping(2, wb2, wb2.SheetNames, result.headers, result.rows);
    }, 30);
  };
  reader.readAsArrayBuffer(file);
});

$('sheetSelect2').addEventListener('change', e => {
  if (!wb2) return;
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在加载工作表...';
  overlay.classList.add('show');
  setTimeout(() => {
    loadSheetFor(2, wb2, e.target.value);
    overlay.classList.remove('show');
  }, 30);
});

function checkBothLoaded() {
  if (data1.length && data2.length) {
    $('matchCard').style.display = '';
    $('statusLeft').textContent = '表格1: ' + data1.length + ' 行，表格2: ' + data2.length + ' 行';
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(m) {
  if (m < 1000) return m.toFixed(1) + ' m';
  return (m / 1000).toFixed(2) + ' km';
}

$('btnMatch').addEventListener('click', () => {
  const nameCol1 = $('nameCol1').value;
  const lngCol1 = $('lngCol1').value;
  const latCol1 = $('latCol1').value;
  const nameCol2 = $('nameCol2').value;
  const lngCol2 = $('lngCol2').value;
  const latCol2 = $('latCol2').value;
  const topN = parseInt($('topN').value) || 3;

  if (!lngCol1 || !latCol1 || !lngCol2 || !latCol2) {
    alert('请选择经度和纬度字段');
    return;
  }

  const overlay = $('loadingOverlay');
  overlay.classList.add('show');

  setTimeout(() => {
    const parsed2 = [];
    data2.forEach((row, i) => {
      const lng = parseFloat(row[lngCol2]);
      const lat = parseFloat(row[latCol2]);
      if (!isNaN(lng) && !isNaN(lat)) {
        parsed2.push({ name: String(row[nameCol2] || ''), lng, lat, row, idx: i });
      }
    });

    matchResults = [];
    let errCount = 0;

    data1.forEach((row, i) => {
      const lng = parseFloat(row[lngCol1]);
      const lat = parseFloat(row[latCol1]);
      if (isNaN(lng) || isNaN(lat)) { errCount++; return; }

      const sourceName = String(row[nameCol1] || '');

      const distances = parsed2.map(p => ({
        name: p.name,
        dist: haversine(lat, lng, p.lat, p.lng),
      }));

      distances.sort((a, b) => a.dist - b.dist);
      const nearest = distances.slice(0, topN);

      matchResults.push({
        sourceName,
        sourceLng: lng,
        sourceLat: lat,
        matches: nearest
      });
    });

    overlay.classList.remove('show');

    renderResults(topN);

    let statusText = '匹配完成: ' + matchResults.length + ' 个基准点，每个匹配 ' + topN + ' 个候选点';
    if (errCount > 0) statusText += '（跳过 ' + errCount + ' 行无效数据）';
    $('statusLeft').textContent = statusText;
  }, 50);
});

function renderResults(topN) {
  $('resultCard').style.display = '';
  $('btnExport').style.display = '';

  $('resultCount').textContent = '(' + matchResults.length + ' 个基准点)';

  let html = '<table class="result-table"><thead><tr>';
  html += '<th>基站中文名</th><th>经度</th><th>纬度</th>';
  for (let i = 1; i <= topN; i++) {
    html += '<th>第' + i + '近距离(米)</th><th>第' + i + '近基站中文名</th>';
  }
  html += '</tr></thead><tbody>';

  matchResults.forEach(r => {
    html += '<tr>';
    html += '<td class="col-source">' + esc(r.sourceName) + '</td>';
    html += '<td>' + r.sourceLng.toFixed(6) + '</td>';
    html += '<td>' + r.sourceLat.toFixed(6) + '</td>';
    for (let i = 0; i < topN; i++) {
      if (i < r.matches.length) {
        html += '<td class="col-dist">' + Math.round(r.matches[i].dist * 10) / 10 + '</td>';
        html += '<td class="col-match">' + esc(r.matches[i].name) + '</td>';
      } else {
        html += '<td></td><td></td>';
      }
    }
    html += '</tr>';
  });

  html += '</tbody></table>';
  $('resultBody').innerHTML = html;

  const allDists = matchResults.flatMap(r => r.matches.map(m => m.dist));
  const avgDist = allDists.reduce((s, d) => s + d, 0) / allDists.length;
  const minDist = Math.min(...allDists);
  const maxDist = Math.max(...allDists);
  $('resultSummary').innerHTML =
    '共 <strong>' + matchResults.length + '</strong> 个基准点 | ' +
    '平均距离: <strong>' + formatDist(avgDist) + '</strong> | ' +
    '最近: <strong>' + formatDist(minDist) + '</strong> | ' +
    '最远: <strong>' + formatDist(maxDist) + '</strong>';
}

$('btnExport').addEventListener('click', () => {
  if (!matchResults.length) { alert('没有可导出的结果'); return; }

  const topN = matchResults[0].matches.length;
  const exportData = matchResults.map(r => {
    const obj = {
      '基站中文名': r.sourceName,
      'lon': r.sourceLng,
      'lat': r.sourceLat,
    };
    for (let i = 0; i < topN; i++) {
      if (i < r.matches.length) {
        obj['第' + (i+1) + '近距离(米)'] = Math.round(r.matches[i].dist * 10) / 10;
        obj['第' + (i+1) + '近基站中文名'] = r.matches[i].name;
      } else {
        obj['第' + (i+1) + '近距离(米)'] = '';
        obj['第' + (i+1) + '近基站中文名'] = '';
      }
    }
    return obj;
  });

  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '匹配结果');
  XLSX.writeFile(wb, '最近点匹配结果.xlsx');
  $('statusLeft').textContent = '已导出 Excel 文件';
});

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
