<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最近点匹配 · OV Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/match.css">
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">📍</div>
    <h1>最近点匹配</h1>
    <span class="ver">Nearest Point Matcher</span>
    <a href="/" class="nav-link">返回地图</a>
  </div>

  <div class="content">

    <div class="card">
      <div class="card-header">
        <span class="dot"></span> 表格1（基准地点）
      </div>
      <div class="card-body">
        <div class="file-zone" id="zone1">
          <input type="file" id="fileInput1" accept=".xlsx,.xls,.csv" />
          <span class="icon">📂</span>
          <span class="hint">点击或拖拽 <strong>Excel / CSV</strong> 文件</span>
        </div>
        <div class="file-info" id="fileInfo1"></div>
        <div class="row" id="sheetRow1" style="display:none"><label>数据源</label><select id="sheetSelect1"></select></div>
        <div class="row" id="nameRow1" style="display:none"><label>名称</label><select id="nameCol1"></select></div>
        <div class="row" id="lngRow1" style="display:none"><label>经度</label><select id="lngCol1"></select></div>
        <div class="row" id="latRow1" style="display:none"><label>纬度</label><select id="latCol1"></select></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="dot" style="background:var(--success)"></span> 表格2（候选地点）
      </div>
      <div class="card-body">
        <div class="file-zone" id="zone2">
          <input type="file" id="fileInput2" accept=".xlsx,.xls,.csv" />
          <span class="icon">📂</span>
          <span class="hint">点击或拖拽 <strong>Excel / CSV</strong> 文件</span>
        </div>
        <div class="file-info" id="fileInfo2"></div>
        <div class="row" id="sheetRow2" style="display:none"><label>数据源</label><select id="sheetSelect2"></select></div>
        <div class="row" id="nameRow2" style="display:none"><label>名称</label><select id="nameCol2"></select></div>
        <div class="row" id="lngRow2" style="display:none"><label>经度</label><select id="lngCol2"></select></div>
        <div class="row" id="latRow2" style="display:none"><label>纬度</label><select id="latCol2"></select></div>
      </div>
    </div>

    <div class="card" id="matchCard" style="display:none">
      <div class="card-body">
        <div class="match-bar">
          <label>每个基准点匹配最近</label>
          <input type="number" id="topN" value="3" min="1" max="100" />
          <label>个候选点</label>
          <button class="btn btn-primary" id="btnMatch">开始匹配</button>
          <button class="btn btn-success" id="btnExport" style="display:none">导出结果</button>
        </div>
      </div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="card-header">
        <span class="dot" style="background:var(--success)"></span> 匹配结果
        <span id="resultCount" style="font-size:10px;color:var(--text-dim);margin-left:8px"></span>
      </div>
      <div class="card-body result-section" id="resultBody"></div>
      <div class="result-summary" id="resultSummary"></div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot-status"></span>
    <span id="statusLeft">就绪</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span class="loading-text">正在匹配...</span>
  </div>

</div>

<button class="page-theme-toggle" onclick="toggleTheme()" title="切换明暗主题">
  <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>
<script src="js/utils.js"></script>
<script>
let wb1 = null, wb2 = null;
let headers1 = [], data1 = [];
let headers2 = [], data2 = [];
let matchResults = [];

function autoSelect(sel, keywords) {
  for (const kw of keywords) {
    const found = [...sel.options].find(o => o.value.toLowerCase().includes(kw.toLowerCase()));
    if (found) { sel.value = found.value; return; }
  }
}

function parseSheet(wb, sheetName) {
  const ws = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
  if (json.length < 2) return null;
  const headers = json[0].map(h => String(h).trim());
  const rows = json.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = row[i] !== undefined ? row[i] : '');
    return obj;
  });
  return { headers, rows };
}

function populateSelect(sel, headers, keywords) {
  sel.innerHTML = '';
  headers.forEach(h => {
    const opt = document.createElement('option');
    opt.value = h; opt.textContent = h;
    sel.appendChild(opt);
  });
  if (keywords) autoSelect(sel, keywords);
}

function showMapping(idx, wb, sheetNames, headers, rows) {
  const sheetRow = $('sheetRow' + idx);
  const sheetSel = $('sheetSelect' + idx);

  if (sheetNames.length > 0) {
    sheetRow.style.display = '';
    sheetSel.innerHTML = '';
    sheetNames.forEach(name => {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sheetSel.appendChild(opt);
    });
  }

  ['nameRow','lngRow','latRow'].forEach(id => $(id + idx).style.display = '');

  const nameKw = ['名称', 'name', 'label', '站点名', '基站名称'];
  const lngKw = ['Longitude', '经度', 'lng', 'longitude', 'lon'];
  const latKw = ['Latitude', '纬度', 'lat', 'latitude'];

  populateSelect($('nameCol' + idx), headers, nameKw);
  populateSelect($('lngCol' + idx), headers, lngKw);
  populateSelect($('latCol' + idx), headers, latKw);

  if (idx === 1) { headers1 = headers; data1 = rows; }
  else { headers2 = headers; data2 = rows; }

  checkBothLoaded();
}

function loadSheetFor(idx, wb, sheetName) {
  const result = parseSheet(wb, sheetName);
  if (!result) { alert('该工作表数据不足'); return; }

  const nameCol = $('nameCol' + idx);
  const lngCol = $('lngCol' + idx);
  const latCol = $('latCol' + idx);
  const curName = nameCol.value, curLng = lngCol.value, curLat = latCol.value;

  populateSelect(nameCol, result.headers, null);
  populateSelect(lngCol, result.headers, null);
  populateSelect(latCol, result.headers, null);

  if (result.headers.includes(curName)) nameCol.value = curName;
  else autoSelect(nameCol, ['名称', 'name', 'label', '站点名', '基站名称']);
  if (result.headers.includes(curLng)) lngCol.value = curLng;
  else autoSelect(lngCol, ['Longitude', '经度', 'lng', 'longitude', 'lon']);
  if (result.headers.includes(curLat)) latCol.value = curLat;
  else autoSelect(latCol, ['Latitude', '纬度', 'lat', 'latitude']);

  if (idx === 1) { headers1 = result.headers; data1 = result.rows; }
  else { headers2 = result.headers; data2 = result.rows; }

  checkBothLoaded();
}

$('fileInput1').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  $('fileInfo1').textContent = '✅ ' + file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
  $('zone1').classList.add('loaded');
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在导入表格1...';
  overlay.classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    setTimeout(() => {
      wb1 = XLSX.read(ev.target.result, { type: 'array' });
      const result = parseSheet(wb1, wb1.SheetNames[0]);
      overlay.classList.remove('show');
      if (!result) { alert('文件数据不足'); return; }
      showMapping(1, wb1, wb1.SheetNames, result.headers, result.rows);
    }, 30);
  };
  reader.readAsArrayBuffer(file);
});

$('sheetSelect1').addEventListener('change', e => {
  if (!wb1) return;
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在加载工作表...';
  overlay.classList.add('show');
  setTimeout(() => {
    loadSheetFor(1, wb1, e.target.value);
    overlay.classList.remove('show');
  }, 30);
});

$('fileInput2').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  $('fileInfo2').textContent = '✅ ' + file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
  $('zone2').classList.add('loaded');
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在导入表格2...';
  overlay.classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    setTimeout(() => {
      wb2 = XLSX.read(ev.target.result, { type: 'array' });
      const result = parseSheet(wb2, wb2.SheetNames[0]);
      overlay.classList.remove('show');
      if (!result) { alert('文件数据不足'); return; }
      showMapping(2, wb2, wb2.SheetNames, result.headers, result.rows);
    }, 30);
  };
  reader.readAsArrayBuffer(file);
});

$('sheetSelect2').addEventListener('change', e => {
  if (!wb2) return;
  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在加载工作表...';
  overlay.classList.add('show');
  setTimeout(() => {
    loadSheetFor(2, wb2, e.target.value);
    overlay.classList.remove('show');
  }, 30);
});

function checkBothLoaded() {
  if (data1.length && data2.length) {
    $('matchCard').style.display = '';
    $('statusLeft').textContent = '表格1: ' + data1.length + ' 行，表格2: ' + data2.length + ' 行';
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(m) {
  if (m < 1000) return m.toFixed(1) + ' m';
  return (m / 1000).toFixed(2) + ' km';
}

const GRID_DEG = 0.01;

function buildSpatialGrid(points) {
  const grid = new Map();
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const gx = Math.floor(p.lng / GRID_DEG);
    const gy = Math.floor(p.lat / GRID_DEG);
    const key = gx + ',' + gy;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(p);
  }
  return grid;
}

function getNeighbors(grid, lat, lng) {
  const gx = Math.floor(lng / GRID_DEG);
  const gy = Math.floor(lat / GRID_DEG);
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const key = (gx + dx) + ',' + (gy + dy);
      const cell = grid.get(key);
      if (cell) {
        for (let i = 0; i < cell.length; i++) result.push(cell[i]);
      }
    }
  }
  return result;
}

$('btnMatch').addEventListener('click', () => {
  const nameCol1 = $('nameCol1').value;
  const lngCol1 = $('lngCol1').value;
  const latCol1 = $('latCol1').value;
  const nameCol2 = $('nameCol2').value;
  const lngCol2 = $('lngCol2').value;
  const latCol2 = $('latCol2').value;
  const topN = parseInt($('topN').value) || 3;

  if (!lngCol1 || !latCol1 || !lngCol2 || !latCol2) {
    alert('请选择经度和纬度字段');
    return;
  }

  const overlay = $('loadingOverlay');
  overlay.classList.add('show');

  setTimeout(() => {
    const parsed2 = [];
    data2.forEach((row, i) => {
      const lng = parseFloat(row[lngCol2]);
      const lat = parseFloat(row[latCol2]);
      if (!isNaN(lng) && !isNaN(lat)) {
        parsed2.push({ name: String(row[nameCol2] || ''), lng, lat, row, idx: i });
      }
    });

    const grid = buildSpatialGrid(parsed2);

    matchResults = [];
    let errCount = 0;

    data1.forEach((row, i) => {
      const lng = parseFloat(row[lngCol1]);
      const lat = parseFloat(row[latCol1]);
      if (isNaN(lng) || isNaN(lat)) { errCount++; return; }

      const sourceName = String(row[nameCol1] || '');
      const candidates = getNeighbors(grid, lat, lng);

      const distances = candidates.map(p => ({
        name: p.name,
        dist: haversine(lat, lng, p.lat, p.lng),
      }));

      distances.sort((a, b) => a.dist - b.dist);
      const nearest = distances.slice(0, topN);

      matchResults.push({
        sourceName,
        sourceLng: lng,
        sourceLat: lat,
        matches: nearest
      });
    });

    overlay.classList.remove('show');

    renderResults(topN);

    let statusText = '匹配完成: ' + matchResults.length + ' 个基准点，每个匹配 ' + topN + ' 个候选点';
    if (errCount > 0) statusText += '（跳过 ' + errCount + ' 行无效数据）';
    $('statusLeft').textContent = statusText;
  }, 50);
});

function renderResults(topN) {
  $('resultCard').style.display = '';
  $('btnExport').style.display = '';

  $('resultCount').textContent = '(' + matchResults.length + ' 个基准点)';

  let html = '<table class="result-table"><thead><tr>';
  html += '<th>基站中文名</th><th>经度</th><th>纬度</th>';
  for (let i = 1; i <= topN; i++) {
    html += '<th>第' + i + '近距离(米)</th><th>第' + i + '近基站中文名</th>';
  }
  html += '</tr></thead><tbody>';

  matchResults.forEach(r => {
    html += '<tr>';
    html += '<td class="col-source">' + esc(r.sourceName) + '</td>';
    html += '<td>' + r.sourceLng.toFixed(6) + '</td>';
    html += '<td>' + r.sourceLat.toFixed(6) + '</td>';
    for (let i = 0; i < topN; i++) {
      if (i < r.matches.length) {
        html += '<td class="col-dist">' + Math.round(r.matches[i].dist * 10) / 10 + '</td>';
        html += '<td class="col-match">' + esc(r.matches[i].name) + '</td>';
      } else {
        html += '<td></td><td></td>';
      }
    }
    html += '</tr>';
  });

  html += '</tbody></table>';
  $('resultBody').innerHTML = html;

  const allDists = matchResults.flatMap(r => r.matches.map(m => m.dist));
  const avgDist = allDists.reduce((s, d) => s + d, 0) / allDists.length;
  const minDist = Math.min(...allDists);
  const maxDist = Math.max(...allDists);
  $('resultSummary').innerHTML =
    '共 <strong>' + matchResults.length + '</strong> 个基准点 | ' +
    '平均距离: <strong>' + formatDist(avgDist) + '</strong> | ' +
    '最近: <strong>' + formatDist(minDist) + '</strong> | ' +
    '最远: <strong>' + formatDist(maxDist) + '</strong>';
}

$('btnExport').addEventListener('click', () => {
  if (!matchResults.length) { alert('没有可导出的结果'); return; }

  const topN = matchResults[0].matches.length;
  const exportData = matchResults.map(r => {
    const obj = {
      '基站中文名': r.sourceName,
      'lon': r.sourceLng,
      'lat': r.sourceLat,
    };
    for (let i = 0; i < topN; i++) {
      if (i < r.matches.length) {
        obj['第' + (i+1) + '近距离(米)'] = Math.round(r.matches[i].dist * 10) / 10;
        obj['第' + (i+1) + '近基站中文名'] = r.matches[i].name;
      } else {
        obj['第' + (i+1) + '近距离(米)'] = '';
        obj['第' + (i+1) + '近基站中文名'] = '';
      }
    }
    return obj;
  });

  const ws = XLSX.utils.json_to_sheet(exportData);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '匹配结果');
  XLSX.writeFile(wb, '最近点匹配结果.xlsx');
  $('statusLeft').textContent = '已导出 Excel 文件';
});
</script>
</body>
</html>
