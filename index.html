<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网页版奥维地图</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%232c3e50'/><circle cx='32' cy='32' r='20' fill='%233498db'/><polygon points='32,8 36,28 32,24 28,28' fill='%23e74c3c'/><polygon points='32,56 28,36 32,40 36,36' fill='%23fff'/><line x1='12' y1='32' x2='52' y2='32' stroke='%23fff' stroke-width='2'/><line x1='32' y1='12' x2='32' y2='52' stroke='%23fff' stroke-width='2'/></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>网页版奥维地图</h3>
        </div>
        <div class="search-box">
            <div class="search-mode-toggle">
                <button class="search-mode-btn active" data-mode="place" onclick="App.setSearchMode('place')">地点</button>
                <button class="search-mode-btn" data-mode="layer" onclick="App.setSearchMode('layer')">图层</button>
                <button class="search-mode-btn" data-mode="coord" onclick="App.setSearchMode('coord')">坐标</button>
            </div>
            <div class="search-input-wrap">
                <input type="text" id="searchInput" placeholder="搜索地点..." autocomplete="off">
                <button id="searchBtn" class="search-btn" onclick="App.doSearch()">&#128269;</button>
                <button class="search-btn" onclick="App.toggleApiKeyBox()" title="搜索设置">&#9881;</button>
            </div>
            <div id="apiKeyBox" class="api-key-box" style="display:none">
                <div class="api-key-label">高德搜索 API Key</div>
                <div class="api-key-row">
                    <input type="text" id="apiKeyInput" placeholder="输入高德 Web服务 Key...">
                    <button class="btn btn-primary" onclick="App.saveApiKey()" style="padding:5px 8px;font-size:11px">保存</button>
                </div>
                <div class="api-key-hint">免费申请: console.amap.com/dev/key/app</div>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
        <div class="sidebar-content">
            <div class="layer-section">
                <h4>底图切换</h4>
                <div class="layer-list" id="baseLayers">
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="satellite" checked> 卫星地图(Esri)
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="gaode"> 高德地图
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="gaodeSatellite"> 高德卫星
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="bingSatellite"> Bing卫星
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="osm"> OpenStreetMap
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="terrain"> 地形图
                    </label>
                </div>
            </div>
            <div class="layer-section">
                <h4>导入图层
                    <button class="btn-cloud-sync" onclick="App.openCloudSync()" title="从云端同步图层">&#8635; 云端同步</button>
                </h4>
                <div class="import-buttons">
                    <button id="importKml" class="btn btn-primary">导入 KML</button>
                    <button id="importGeoJson" class="btn btn-primary">导入 GeoJSON</button>
                    <button id="importGpx" class="btn btn-primary">导入 GPX</button>
                </div>
                <input type="file" id="fileInput" accept=".kml,.geojson,.json,.gpx" style="display:none">
            </div>
            <div class="layer-section">
                <h4>已导入图层
                    <button class="btn-cloud-sync" id="toggleAllLayersBtn" onclick="App.toggleAllLayers()" title="隐藏/显示全部图层">&#128065; 隐藏全部</button>
                </h4>
                <div id="importedLayers" class="layer-list"></div>
            </div>
            <div class="layer-section">
                <h4>测量结果</h4>
                <div id="measureResults">
                    <p class="empty-hint">使用绘图工具进行测量</p>
                </div>
                <button class="btn btn-warn" onclick="App.clearMeasurements()" style="margin-top:8px;width:100%">清除测量</button>
            </div>
            <div class="layer-section">
                <h4>工具</h4>
                <a href="/match" target="_blank" class="btn btn-primary" style="width:100%;text-decoration:none;justify-content:center">📍 最近点匹配</a>
                <a href="/kml" target="_blank" class="btn btn-primary" style="width:100%;text-decoration:none;justify-content:center;margin-top:6px">◫ 图层工具</a>
            </div>
            <div class="layer-section">
                <h4>数据管理</h4>
                <button class="btn btn-danger" onclick="App.clearAllData()" style="width:100%">清除所有存储数据</button>
                <p class="empty-hint" style="margin-top:6px">清除后刷新页面生效</p>
            </div>
        </div>
    </div>
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="App.toggleSidebarCollapse()" title="折叠/展开菜单">&#10094;</button>
    <div id="map"></div>
    <div id="coordinates">
        <span id="cursorPos">经度: 0.000000, 纬度: 0.000000</span>
        <span id="zoomLevel">缩放级别: 5</span>
    </div>
    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>
    <div id="contextMenu" class="context-menu">
        <div class="context-title">获取坐标</div>
        <div class="context-coord" id="ctxCoord"></div>
        <div class="context-actions">
            <button onclick="App.copyCoord()">复制坐标</button>
            <button onclick="App.searchFromCtx()">搜索附近</button>
            <button onclick="App.addMarkerFromCtx()">添加标记</button>
        </div>
    </div>

    <div id="cloudSyncModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">&#9729; 图层同步</span>
                <button class="modal-close" onclick="App.closeCloudSync()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="cloud-tabs">
                    <button class="cloud-tab active" data-tab="cloud" onclick="App.switchCloudTab('cloud')">云端数据</button>
                    <button class="cloud-tab" data-tab="local" onclick="App.switchCloudTab('local')">浏览器数据</button>
                </div>
                <div class="cloud-tab-content active" id="cloudTabCloud">
                    <div class="cloud-api-bar">
                        <input type="text" id="cloudApiInput" placeholder="后端 API 地址，如 http://localhost:3000" />
                        <button onclick="App.connectCloudApi()">连接</button>
                    </div>
                    <div id="cloudApiStatus"></div>
                    <div id="cloudRemoteFileList"></div>
                </div>
                <div class="cloud-tab-content" id="cloudTabLocal">
                    <div id="cloudLocalFileList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="App.syncSelectedCloudFiles()">同步选中</button>
                <button class="btn" onclick="App.closeCloudSync()" style="background:#4a6278;color:#ecf0f1">关闭</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@4.5.0/dist/togeojson.umd.js"></script>
    <script src="https://unpkg.com/togpx@0.5.4/togpx.js"></script>
    <script src="js/app.js"></script>
    <script>
    (function() {
        let rightDown = false;
        let startX, startY, startCenter;
        const DRAG_THRESHOLD = 3;
        let moved = false;
        let pendingCtx = null;

        const mapContainer = document.getElementById('map');

        mapContainer.addEventListener('contextmenu', function(e) {
            if (rightDown) {
                e.preventDefault();
                e.stopPropagation();
                pendingCtx = {
                    latlng: App.map.mouseEventToLatLng(e),
                    cx: e.clientX,
                    cy: e.clientY
                };
            }
        }, true);

        mapContainer.addEventListener('mousedown', function(e) {
            if (e.button !== 2) return;
            if (!App.map) return;
            rightDown = true;
            moved = false;
            pendingCtx = null;
            startX = e.clientX;
            startY = e.clientY;
            startCenter = App.map.getCenter();
        });

        document.addEventListener('mousemove', function(e) {
            if (!rightDown) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (!moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
            if (!moved) {
                moved = true;
                pendingCtx = null;
                mapContainer.style.cursor = 'grabbing';
            }
            const map = App.map;
            const targetPixel = map.latLngToContainerPoint(startCenter);
            const newPoint = L.point(targetPixel.x - dx, targetPixel.y - dy);
            const newCenter = map.containerPointToLatLng(newPoint);
            map.setView(newCenter, map.getZoom(), { animate: false });
        });

        document.addEventListener('mouseup', function(e) {
            if (e.button !== 2 || !rightDown) return;
            rightDown = false;
            mapContainer.style.cursor = '';
            if (!moved && pendingCtx) {
                App._showContextMenu(pendingCtx.latlng, pendingCtx.cx, pendingCtx.cy);
            }
            pendingCtx = null;
            startX = undefined;
            startY = undefined;
            startCenter = undefined;
        });
    })();
    </script>
    <script>
    (function() {
        var scrollTimer = null;
        var el = document.querySelector('.sidebar-content');
        if (el) {
            el.addEventListener('scroll', function() {
                el.classList.add('scrolling');
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(function() { el.classList.remove('scrolling'); }, 800);
            }, { passive: true });
        }
    })();
    </script>
</body>
</html>
