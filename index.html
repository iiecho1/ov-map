<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OV Map · 网页版奥维地图</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230ea5e9'/><circle cx='32' cy='32' r='18' fill='none' stroke='%23fff' stroke-width='3'/><circle cx='32' cy='32' r='4' fill='%23fff'/><line x1='32' y1='14' x2='32' y2='50' stroke='%23fff' stroke-width='2'/><line x1='14' y1='32' x2='50' y2='32' stroke='%23fff' stroke-width='2'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="App.toggleSidebar()"></div>

    <div id="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-logo">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <circle cx="12" cy="12" r="4"/>
                        <line x1="12" y1="2" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="22" y2="12"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">OV Map</span>
                    <span class="brand-sub">网页版奥维地图</span>
                </div>
            </div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换明暗主题">
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>

        <div class="search-box">
            <div class="search-mode-toggle">
                <button class="search-mode-btn active" data-mode="place" onclick="App.setSearchMode('place')">地点</button>
                <button class="search-mode-btn" data-mode="layer" onclick="App.setSearchMode('layer')">图层</button>
                <button class="search-mode-btn" data-mode="coord" onclick="App.setSearchMode('coord')">坐标</button>
            </div>
            <div id="searchScopeWrap" class="search-scope-toggle" style="display:none">
                <button class="search-scope-btn active" data-scope="all" onclick="App.setSearchScope('all')">全部</button>
                <button class="search-scope-btn" data-scope="name" onclick="App.setSearchScope('name')">标签名</button>
                <button class="search-scope-btn" data-scope="desc" onclick="App.setSearchScope('desc')">备注</button>
            </div>
            <div class="search-input-wrap">
                <input type="text" id="searchInput" placeholder="搜索地点..." autocomplete="off">
                <button id="searchBtn" class="search-btn primary" onclick="App.doSearch()" title="搜索">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button class="search-btn" onclick="App.toggleApiKeyBox()" title="搜索设置">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
            <div id="apiKeyBox" class="api-key-box" style="display:none">
                <div class="api-key-label">高德搜索 API Key</div>
                <div class="api-key-row">
                    <input type="text" id="apiKeyInput" placeholder="输入高德 Web服务 Key...">
                    <button class="btn btn-accent" onclick="App.saveApiKey()" style="padding:5px 10px;font-size:11px">保存</button>
                </div>
                <div class="api-key-hint">免费申请: console.amap.com/dev/key/app</div>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>

        <div class="sidebar-content">
            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                        底图切换
                    </h4>
                </div>
                <div class="layer-list" id="baseLayers">
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="satellite" checked>
                        <span class="layer-radio"></span>
                        <span>🛰️ 卫星地图 (Esri)</span>
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="gaode">
                        <span class="layer-radio"></span>
                        <span>🗺️ 高德地图</span>
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="gaodeSatellite">
                        <span class="layer-radio"></span>
                        <span>🌍 高德卫星</span>
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="bingSatellite">
                        <span class="layer-radio"></span>
                        <span>🌐 Bing 卫星</span>
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="osm">
                        <span class="layer-radio"></span>
                        <span>🧭 OpenStreetMap</span>
                    </label>
                    <label class="layer-item">
                        <input type="radio" name="baseLayer" value="terrain">
                        <span class="layer-radio"></span>
                        <span>⛰️ 地形图</span>
                    </label>
                </div>
            </div>

            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        导入图层
                    </h4>
                    <button class="btn-inline" onclick="App.openCloudSync()" title="从云端同步图层">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        云端
                    </button>
                </div>
                <div class="import-buttons">
                    <button id="importKml" class="btn btn-import">
                        <span class="btn-dot kml"></span> KML
                    </button>
                    <button id="importGeoJson" class="btn btn-import">
                        <span class="btn-dot geojson"></span> GeoJSON
                    </button>
                    <button id="importGpx" class="btn btn-import">
                        <span class="btn-dot gpx"></span> GPX
                    </button>
                </div>
                <input type="file" id="fileInput" accept=".kml,.geojson,.json,.gpx" style="display:none">
            </div>

            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                        图层
                    </h4>
                    <div style="display:flex;gap:4px">
                        <button class="btn-inline" id="toggleLabelsBtn" onclick="App.toggleLabels()" title="隐藏标签名">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
                            隐藏标签
                        </button>
                        <button class="btn-inline" id="toggleAllLayersBtn" onclick="App.toggleAllLayers()" title="隐藏/显示全部图层">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            隐藏全部
                        </button>
                    </div>
                </div>
                <div id="importedLayers" class="layer-list"></div>
            </div>

            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h5l3-9 4 18 3-9h5"/></svg>
                        测量结果
                    </h4>
                </div>
                <div id="measureResults">
                    <p class="empty-hint">使用绘图工具进行测量</p>
                </div>
                <button class="btn btn-outline-danger" onclick="App.clearMeasurements()" style="margin-top:8px;width:100%">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    清除测量
                </button>
            </div>

            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                        工具
                    </h4>
                </div>
                <div class="tool-links">
                    <a href="/match" target="_blank" class="tool-link">
                        <span class="tool-icon">📍</span>
                        <span class="tool-text">
                            <span class="tool-name">最近点匹配</span>
                            <span class="tool-desc">Excel 坐标批量匹配</span>
                        </span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </a>
                    <a href="/kml" target="_blank" class="tool-link">
                        <span class="tool-icon">◫</span>
                        <span class="tool-text">
                            <span class="tool-name">图层工具</span>
                            <span class="tool-desc">KML 格式转换处理</span>
                        </span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </a>
                </div>
            </div>

            <div class="layer-section">
                <div class="section-header">
                    <h4>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                        数据管理
                    </h4>
                </div>
                <button class="btn btn-danger" onclick="App.clearAllData()" style="width:100%">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    清除所有存储数据
                </button>
                <p class="empty-hint" style="margin-top:6px">清除后刷新页面生效</p>
            </div>
        </div>
    </div>

    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" onclick="App.toggleSidebarCollapse()" title="折叠/展开菜单">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div id="map"></div>

    <div id="coordinates">
        <div class="coord-left">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="cursorPos">经度: 0.000000, 纬度: 0.000000</span>
        </div>
        <div class="coord-right">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            <span id="zoomLevel">缩放级别: 5</span>
        </div>
    </div>

    <div id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <div id="contextMenu" class="context-menu">
        <div class="context-title">获取坐标</div>
        <div class="context-coord" id="ctxCoord"></div>
        <div class="context-actions">
            <button onclick="App.copyCoord()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                复制坐标
            </button>
            <button onclick="App.searchFromCtx()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                搜索附近
            </button>
            <button onclick="App.addMarkerFromCtx()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                添加标记
            </button>
        </div>
    </div>

    <div id="cloudSyncModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
                    图层同步
                </span>
                <button class="modal-close" onclick="App.closeCloudSync()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="cloud-tabs">
                    <button class="cloud-tab active" data-tab="cloud" onclick="App.switchCloudTab('cloud')">云端数据</button>
                    <button class="cloud-tab" data-tab="local" onclick="App.switchCloudTab('local')">浏览器数据</button>
                </div>
                <div class="cloud-tab-content active" id="cloudTabCloud">
                    <div class="cloud-api-bar">
                        <input type="text" id="cloudApiInput" placeholder="后端 API 地址，如 http://localhost:3000" />
                        <button onclick="App.connectCloudApi()">连接</button>
                    </div>
                    <div id="cloudApiStatus"></div>
                    <div id="cloudRemoteFileList"></div>
                </div>
                <div class="cloud-tab-content" id="cloudTabLocal">
                    <div id="cloudLocalFileList"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-accent" onclick="App.syncSelectedCloudFiles()">同步选中</button>
                <button class="btn btn-ghost" onclick="App.closeCloudSync()">关闭</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@4.5.0/dist/togeojson.umd.js"></script>
    <script src="https://unpkg.com/togpx@0.5.4/togpx.js"></script>
    <script src="js/app.js"></script>
    <script src="js/utils.js"></script>
    <script>
    (function() {
        let rightDown = false;
        let startX, startY, startCenter;
        const DRAG_THRESHOLD = 3;
        let moved = false;
        let pendingCtx = null;
        const mapContainer = document.getElementById('map');

        mapContainer.addEventListener('contextmenu', function(e) {
            if (rightDown) {
                e.preventDefault();
                e.stopPropagation();
                pendingCtx = {
                    latlng: App.map.mouseEventToLatLng(e),
                    cx: e.clientX,
                    cy: e.clientY
                };
            }
        }, true);

        mapContainer.addEventListener('mousedown', function(e) {
            if (e.button !== 2) return;
            if (!App.map) return;
            rightDown = true;
            moved = false;
            pendingCtx = null;
            startX = e.clientX;
            startY = e.clientY;
            startCenter = App.map.getCenter();
        });

        document.addEventListener('mousemove', function(e) {
            if (!rightDown) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            if (!moved && Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
            if (!moved) {
                moved = true;
                pendingCtx = null;
                mapContainer.style.cursor = 'grabbing';
            }
            const map = App.map;
            const targetPixel = map.latLngToContainerPoint(startCenter);
            const newPoint = L.point(targetPixel.x - dx, targetPixel.y - dy);
            const newCenter = map.containerPointToLatLng(newPoint);
            map.setView(newCenter, map.getZoom(), { animate: false });
        });

        document.addEventListener('mouseup', function(e) {
            if (e.button !== 2 || !rightDown) return;
            rightDown = false;
            mapContainer.style.cursor = '';
            if (!moved && pendingCtx) {
                App._showContextMenu(pendingCtx.latlng, pendingCtx.cx, pendingCtx.cy);
            }
            pendingCtx = null;
            startX = undefined;
            startY = undefined;
            startCenter = undefined;
        });
    })();

    (function() {
        var scrollTimer = null;
        var el = document.querySelector('.sidebar-content');
        if (el) {
            el.addEventListener('scroll', function() {
                el.classList.add('scrolling');
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(function() { el.classList.remove('scrolling'); }, 800);
            }, { passive: true });
        }
    })();
    </script>
</body>
</html>
