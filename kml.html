<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图层工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #222240;
  --border: #2a2a4a;
  --text: #d4d4e8;
  --text-muted: #8888aa;
  --text-dim: #5c5c7a;
  --accent: #7c8cf8;
  --accent-hover: #9aa8ff;
  --success: #4ade80;
  --success-hover: #6ee7a0;
  --danger: #f87171;
  --danger-hover: #fca5a5;
  --warning: #fbbf24;
  --warning-hover: #fcd34d;
  --radius: 10px;
  --radius-sm: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Inter", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  font-size: 13px;
  line-height: 1.5;
}

.app {
  width: 100%;
  max-width: 900px;
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0,.5);
}

.header {
  background: linear-gradient(135deg, #1e1e3a 0%, #1a1a2e 100%);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border);
}

.header .logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent), #c084fc);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  color: #fff;
  font-weight: bold;
}

.header h1 { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
.header .ver { font-size: 10px; color: var(--text-dim); margin-left: auto; }

.content { padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; }

.card {
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: border-color .2s;
}

.card-header {
  padding: 10px 16px;
  background: rgba(0,0,0,.15);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
  letter-spacing: .2px;
  cursor: pointer;
  user-select: none;
}

.card-header .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
}

.card-header .chevron {
  margin-left: auto;
  font-size: 10px;
  transition: transform .25s;
  color: var(--text-dim);
}
.card-header .chevron.collapsed { transform: rotate(-90deg); }

.card-body {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Form rows */
.row { display: flex; align-items: center; gap: 10px; }
.row label { min-width: 52px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.row > * + * { flex: 1; }

.row-row { display: flex; align-items: center; gap: 12px; }

input[type="text"], input[type="number"], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  font-family: inherit;
}
input[type="text"]:focus, input[type="number"]:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(124,140,248,.12);
}
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5 5L9 1' stroke='%238888aa' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; }
select option { background: var(--surface); }

input[type="color"] {
  width: 36px; height: 28px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  background: none;
  padding: 2px;
}
input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
input[type="color"]::-webkit-color-swatch { border-radius: 3px; border: none; }

input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  height: 4px;
  cursor: pointer;
}

/* File upload */
.file-zone {
  position: relative;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  background: rgba(124,140,248,.03);
}
.file-zone:hover {
  border-color: var(--accent);
  background: rgba(124,140,248,.07);
}
.file-zone input[type="file"] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; z-index: 1;
}
.file-zone .icon { font-size: 32px; display: block; margin-bottom: 6px; opacity: .8; pointer-events: none; }
.file-zone .hint { font-size: 12px; color: var(--text-muted); pointer-events: none; }
.file-zone .hint strong { color: var(--accent); }

/* Buttons */
.btn {
  padding: 7px 16px;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .1px;
  transition: all .2s;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.btn:active { transform: scale(.97); }

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }

.btn-success { background: #166534; color: #bbf7d0; }
.btn-success:hover { background: #15803d; }

.btn-danger { background: #7f1d1d; color: #fecaca; }
.btn-danger:hover { background: #991b1b; }

.btn-warning { background: #451a03; color: #fde68a; }
.btn-warning:hover { background: #78350f; }

.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }

.btn-sm { padding: 4px 10px; font-size: 11px; }
.btn-xs { padding: 2px 8px; font-size: 10px; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Tags / chips */
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 500;
  background: rgba(124,140,248,.15);
  color: var(--accent);
}

/* Columns checklist */
.column-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
  padding-right: 4px;
}
.column-grid::-webkit-scrollbar { width: 4px; }
.column-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.column-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 8px;
  background: var(--bg);
  border-radius: var(--radius-sm);
  font-size: 11px;
  cursor: pointer;
  transition: background .15s;
}
.column-chip:hover { background: rgba(124,140,248,.08); }
.column-chip input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }
.column-chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Category rows */
.cat-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; padding-right: 4px; }
.cat-list::-webkit-scrollbar { width: 4px; }
.cat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cat-item {
  background: var(--bg);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  transition: border-color .15s;
}
.cat-item:hover { border-color: var(--accent); }

.cat-item select { width: auto; min-width: 80px; }
.cat-item input[type="number"] { width: 54px; padding-right: 4px; }
.cat-item label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
.cat-item .sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

.cat-del {
  background: none; border: none;
  color: var(--danger);
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
  line-height: 1;
  opacity: .6;
  transition: opacity .15s;
}
.cat-del:hover { opacity: 1; }

/* Status bar */
.status-bar {
  padding: 10px 28px;
  background: rgba(0,0,0,.2);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-bar .separator { flex: 1; }
.status-bar .dot-status {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

/* Loading */
.loading-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,15,26,.85);
  z-index: 9999;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 13px; color: var(--text-muted); }

/* Error list */
.error-item {
  padding: 6px 10px;
  margin-bottom: 4px;
  background: rgba(248,113,113,.08);
  border: 1px solid rgba(248,113,113,.15);
  border-radius: var(--radius-sm);
  font-size: 11px;
  color: var(--text);
  font-family: "JetBrains Mono", "Consolas", monospace;
  word-break: break-all;
}
.error-item .err-row { color: var(--accent); font-weight: 600; }
.error-item .err-field { color: var(--warning); }
.error-item .err-val { color: var(--danger); }
.error-item .err-reason { color: var(--text-dim); font-style: italic; }

/* Misc */
.file-info { margin-top: 4px; font-size: 11px; color: var(--accent); font-weight: 500; }

.full-width { width: 100%; }
.text-center { text-align: center; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }

/* Responsive */
@media (max-width: 640px) {
  body { padding: 12px; }
  .app { border-radius: 12px; }
  .content { padding: 16px 14px; gap: 14px; }
  .card-body { padding: 12px; }
}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">◫</div>
    <h1>图层工具</h1>
    <span class="ver">KML Generator</span>
  </div>

  <div class="content">
    <!-- 导入 -->
    <div class="card">
      <div class="card-header">
        <span class="dot"></span> 导入数据
      </div>
      <div class="card-body">
        <div class="file-zone">
          <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />
          <span class="icon">📂</span>
          <span class="hint">点击或拖拽 <strong>Excel / CSV</strong> 文件</span>
        </div>
        <div class="file-info" id="fileInfo"></div>
      </div>
    </div>

    <!-- 字段映射 -->
    <div class="card" id="mappingSection" style="display:none">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="dot"></span> 字段映射
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="row"><label>数据源</label><select id="sheetSelect"></select></div>
        <div class="row"><label>标签名</label><select id="labelCol"></select></div>
        <div class="row"><label>经度</label><select id="lngCol"></select></div>
        <div class="row"><label>纬度</label><select id="latCol"></select></div>
        <div class="row"><label>方位角</label><select id="azimuthCol"><option value="">-- 不使用 --</option></select></div>
      </div>
    </div>

    <!-- 扇区样式 -->
    <div class="card" id="polygonSection" style="display:none">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="dot"></span> 扇区样式
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="row"><label>形状</label><select id="defaultShape"><option value="sector">扇形</option><option value="sword">剑形</option><option value="triangle">三角形</option></select></div>
        <div class="row"><label>角度</label><input type="range" id="sectorAngle" min="0" max="90" value="40" /><input type="number" id="sectorAngleInput" min="0" max="90" value="40" style="width:56px;flex:none" /><span style="font-size:11px;color:var(--text-dim);white-space:nowrap">°</span></div>
        <div class="row"><label>半径</label><input type="range" id="sectorRadius" min="0" max="150" value="80" /><input type="number" id="sectorRadiusInput" min="0" max="150" value="80" style="width:56px;flex:none" /><span style="font-size:11px;color:var(--text-dim);white-space:nowrap">m</span></div>
        <div class="row"><label>填充颜色</label><input type="color" id="defaultFillColor" value="#7c8cf8" /></div>
        <div class="row"><label>边框颜色</label><input type="color" id="defaultLineColor" value="#f87171" /></div>
        <div class="row"><label style="min-width:auto;cursor:pointer"><input type="checkbox" id="showBorder" checked style="margin-right:6px" />显示边框</label></div>
      </div>
    </div>

    <!-- 分类显示 -->
    <div class="card" id="categorySection" style="display:none">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="dot"></span> 分类显示
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="row"><label>分类字段</label><select id="categoryCol"><option value="">-- 不分类 --</option></select></div>
        <div id="categoryStylesContainer" style="display:none">
          <div class="cat-list" id="categoryStyles"></div>
          <button class="btn btn-sm btn-ghost mt-2 full-width" id="btnAddCatRow">+ 添加分类</button>
        </div>
      </div>
    </div>

    <!-- 导出列 -->
    <div class="card" id="columnsSection" style="display:none">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="dot"></span> 导出列
        <span class="chevron">▼</span>
        <span style="font-size:10px;color:var(--text-dim);margin-left:8px" id="colCount"></span>
      </div>
      <div class="card-body">
        <div class="row" style="margin-bottom:4px">
          <label style="cursor:pointer;display:flex;align-items:center;gap:4px">
            <input type="checkbox" id="selectAllCols" checked /> 全选
          </label>
        </div>
        <div class="column-grid" id="columnList"></div>
      </div>
    </div>

    <!-- 操作区 -->
    <div class="card" id="generateSection" style="display:none">
      <div class="card-body text-center" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-success" id="btnGenerate" style="padding:10px 32px;font-size:14px">生成 KML</button>
        <button class="btn btn-primary" id="btnExport" style="padding:10px 32px;font-size:14px">导出 KML</button>
        <button class="btn btn-warning" id="btnSyncCloud" style="padding:10px 24px;font-size:14px">&#9729; 同步</button>
      </div>
    </div>

    <!-- 错误报告 -->
    <div class="card" id="errorSection" style="display:none">
      <div class="card-header" onclick="toggleCard(this)">
        <span class="dot" style="background:var(--danger)"></span> 数据校验错误
        <span class="chevron">▼</span>
        <span style="font-size:10px;color:var(--danger);margin-left:8px" id="errorCount"></span>
      </div>
      <div class="card-body" style="max-height:300px;overflow-y:auto">
        <div id="errorList"></div>
      </div>
    </div>

    <!-- 配置管理 -->
    <div class="card">
      <div class="card-header">
        <span class="dot"></span> 配置管理
      </div>
      <div class="card-body">
        <div class="row">
          <label>加载配置</label>
          <select id="savedConfigSelect"><option value="">-- 选择已保存配置 --</option></select>
          <div class="btn-group" style="flex:none">
            <button class="btn btn-sm btn-primary" id="btnLoadSaved">加载</button>
            <button class="btn btn-sm btn-danger" id="btnDeleteSaved">删除</button>
          </div>
        </div>
        <div class="row">
          <label>保存为</label>
          <input type="text" id="configNameInput" placeholder="输入配置名称" />
          <button class="btn btn-sm btn-success" id="btnSaveConfig" style="flex:none">保存到浏览器</button>
        </div>
        <div class="btn-group" style="justify-content:center">
          <button class="btn btn-sm btn-warning" id="btnExportConfig">导出配置文件</button>
          <button class="btn btn-sm btn-warning" id="btnImportConfig">导入配置文件</button>
        </div>
        <input type="file" id="configFileInput" accept=".json" style="display:none" />
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot-status"></span>
    <span id="statusLeft">就绪</span>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <span class="loading-text">正在解析文件...</span>
  </div>

</div>

<script>
let workbook = null;
let originalSheetData = [];
let currentSheetData = [];
let currentHeaders = [];
let sourceFileName = '';
let lastKmlData = null;

const DEFAULT_COLORS = ['#ffff80','#00ff00','#8000ff','#ff0080','#00ffff','#ff8000','#80ff00','#0080ff','#ff0000','#00ff80'];
const $ = id => document.getElementById(id);

function toggleCard(headerEl) {
  const body = headerEl.parentElement.querySelector('.card-body');
  const chevron = headerEl.querySelector('.chevron');
  if (!body || !chevron) return;
  if (body.style.display === 'none') {
    body.style.display = '';
    chevron.classList.remove('collapsed');
  } else {
    body.style.display = 'none';
    chevron.classList.add('collapsed');
  }
}

$('sectorAngle').addEventListener('input', e => { $('sectorAngleInput').value = e.target.value; });
$('sectorAngleInput').addEventListener('input', e => { $('sectorAngle').value = e.target.value; });
$('sectorRadius').addEventListener('input', e => { $('sectorRadiusInput').value = e.target.value; });
$('sectorRadiusInput').addEventListener('input', e => { $('sectorRadius').value = e.target.value; });

$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  sourceFileName = file.name.replace(/\.[^.]+$/, '');
  $('fileInfo').textContent = '✅ ' + file.name + ' (' + (file.size/1024).toFixed(1) + 'KB)';
  $('loadingOverlay').classList.add('show');
  const reader = new FileReader();
  reader.onload = ev => {
    setTimeout(() => {
      workbook = XLSX.read(ev.target.result, {type:'array'});
      populateSheetSelect();
      ['mappingSection','columnsSection','polygonSection','categorySection','generateSection'].forEach(id => $(id).style.display='');
      loadSheet(workbook.SheetNames[0]);
      $('loadingOverlay').classList.remove('show');
    }, 30);
  };
  reader.readAsArrayBuffer(file);
});

function populateSheetSelect() {
  const sel = $('sheetSelect');
  sel.innerHTML = '';
  workbook.SheetNames.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
  sel.onchange = () => loadSheet(sel.value);
}

function loadSheet(sheetName) {
  const ws = workbook.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(ws, {header:1});
  if (json.length < 2) {alert('数据不足'); return;}
  currentHeaders = json[0].map(h => String(h).trim());
  currentSheetData = json.slice(1).map(row => {
    const obj = {};
    currentHeaders.forEach((h, i) => obj[h] = row[i] !== undefined ? row[i] : '');
    return obj;
  });
  originalSheetData = [...currentSheetData];
  populateColumnSelects();
  expandAzimuthRows();
  populateColumnList();
  const rowCount = currentSheetData.length, colCount = currentHeaders.length;
  $('fileInfo').textContent = '✅ ' + (sourceFileName || '数据') + ' — 读取 ' + rowCount + ' 行数据（不含表头），' + colCount + ' 列';
  $('statusLeft').textContent = '已加载 ' + rowCount + ' 行 × ' + colCount + ' 列';
}

function expandAzimuthRows() {
  const azCol = $('azimuthCol').value;
  if (!azCol) { currentSheetData = [...originalSheetData]; return; }
  const expanded = [];
  originalSheetData.forEach(row => {
    const val = String(row[azCol] ?? '');
    if (val.includes('_')) {
      val.split('_').forEach(v => {
        expanded.push({...row, [azCol]: v.trim()});
      });
    } else {
      expanded.push(row);
    }
  });
  currentSheetData = expanded;
}

function populateColumnSelects() {
  const selects = ['labelCol','lngCol','latCol','azimuthCol','categoryCol'];
  selects.forEach(id => {
    const sel = $(id);
    const current = sel.value;
    const firstOpt = (id === 'azimuthCol' || id === 'categoryCol') ? sel.options[0].outerHTML : '';
    sel.innerHTML = firstOpt;
    currentHeaders.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      sel.appendChild(opt);
    });
    if (current && currentHeaders.includes(current)) sel.value = current;
  });
  autoSelect('labelCol', ['基站名称','名称','标签','name','label','站点名']);
  autoSelect('lngCol', ['Longitude','经度','lng','longitude','lon']);
  autoSelect('latCol', ['Latitude','纬度','lat','latitude']);
  autoSelect('azimuthCol', ['方位角','azimuth','方向角','bearing']);
}

function autoSelect(id, keywords) {

function hexToKmlColor(hex, opacity) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return Math.round(opacity * 2.55).toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + r.toString(16).padStart(2,'0');
}

function makeSectorPoints(lat, lng, azimuth, halfAngle, radius, steps, shape) {
  if (shape === 'sword') return makeSwordPoints(lat, lng, azimuth, halfAngle, radius, steps);
  if (shape === 'triangle') return makeTrianglePoints(lat, lng, azimuth, halfAngle, radius);
  const points = [[lat, lng]];
  for (let i = 0; i <= steps; i++) {
    const a = (azimuth - halfAngle + (2 * halfAngle * i / steps)) * Math.PI / 180;
    points.push([lat + (radius/111320)*Math.cos(a), lng + (radius/(111320*Math.cos(lat*Math.PI/180)))*Math.sin(a)]);
  }
  points.push([lat, lng]);
  return points;
}

function makeSwordPoints(lat, lng, azimuth, halfAngle, radius, steps) {
  const cosLat = Math.cos(lat * Math.PI / 180);
  const toDLat = r => r / 111320;
  const toDLng = r => r / (111320 * cosLat);
  const midAngle = azimuth * Math.PI / 180;
  const arcRadius = Math.max(radius - 10, radius * 0.75);
  const leftAngle = (azimuth + halfAngle) * Math.PI / 180;
  const rightAngle = (azimuth - halfAngle) * Math.PI / 180;
  return [
    [lat, lng],
    [lat + toDLat(arcRadius)*Math.cos(leftAngle), lng + toDLng(arcRadius)*Math.sin(leftAngle)],
    [lat + toDLat(radius)*Math.cos(midAngle), lng + toDLng(radius)*Math.sin(midAngle)],
    [lat + toDLat(arcRadius)*Math.cos(rightAngle), lng + toDLng(arcRadius)*Math.sin(rightAngle)],
    [lat, lng]
  ];
}

function makeTrianglePoints(lat, lng, azimuth, halfAngle, radius) {
  const cosLat = Math.cos(lat * Math.PI / 180);
  const toDLat = r => r / 111320;
  const toDLng = r => r / (111320 * cosLat);
  const l = (azimuth - halfAngle) * Math.PI / 180;
  const m = azimuth * Math.PI / 180;
  const ri = (azimuth + halfAngle) * Math.PI / 180;
  return [[lat,lng],[lat+toDLat(radius)*Math.cos(l),lng+toDLng(radius)*Math.sin(l)],[lat+toDLat(radius)*Math.cos(m),lng+toDLng(radius)*Math.sin(m)],[lat+toDLat(radius)*Math.cos(ri),lng+toDLng(radius)*Math.sin(ri)],[lat,lng]];
}

function generateKML() {
  const labelCol = $('labelCol').value, lngCol = $('lngCol').value, latCol = $('latCol').value, azimuthCol = $('azimuthCol').value;
  const defAngle = parseInt($('sectorAngle').value), defRadius = parseInt($('sectorRadius').value);
  const defFillColor = $('defaultFillColor').value, defShape = $('defaultShape').value;
  const defLineColor = $('defaultLineColor').value;
  const categoryCol = $('categoryCol').value, enableCategory = !!categoryCol;
  if (!lngCol || !latCol) {alert('请选择经度和纬度列'); return;}
  const selectedCols = [...document.querySelectorAll('.col-check:checked')].map(cb => cb.dataset.col);
  const catStyleMap = enableCategory ? getCatStyleMap() : {};
  const allCatValues = new Set();
  const placemarks = [];
  const errors = [];
  let count = 0;

  currentSheetData.forEach((row, idx) => {
    const rowNum = idx + 1;
    const lngRaw = row[lngCol], latRaw = row[latCol];
    const lng = parseFloat(lngRaw), lat = parseFloat(latRaw);

    if (lngRaw === undefined || lngRaw === null || String(lngRaw).trim() === '') {
      errors.push({row:rowNum, field:lngCol, val:'(空)', reason:'经度不能为空'});
      return;
    }
    if (latRaw === undefined || latRaw === null || String(latRaw).trim() === '') {
      errors.push({row:rowNum, field:latCol, val:'(空)', reason:'纬度不能为空'});
      return;
    }
    if (isNaN(lng)) {
      errors.push({row:rowNum, field:lngCol, val:String(lngRaw), reason:'经度格式错误，无法转为数字'});
      return;
    }
    if (isNaN(lat)) {
      errors.push({row:rowNum, field:latCol, val:String(latRaw), reason:'纬度格式错误，无法转为数字'});
      return;
    }

    let azimuth = null;
    if (azimuthCol) {
      const azRaw = row[azimuthCol];
      if (azRaw !== undefined && azRaw !== null && String(azRaw).trim() !== '') {
        azimuth = parseFloat(azRaw);
        if (isNaN(azimuth)) {
          errors.push({row:rowNum, field:azimuthCol, val:String(azRaw), reason:'方位角格式错误，无法转为数字'});
          return;
        }
      }
    }

    const label = labelCol ? String(row[labelCol]||'') : '';
    let fillColor = defFillColor, lineColor = defLineColor, fillOpacity = 90, noBorder = false;
    let angle = defAngle, radius = defRadius, shape = defShape;
    if (enableCategory) {
      const catVal = String(row[categoryCol]||'');
      if (catStyleMap[catVal]) { const st = catStyleMap[catVal]; fillColor=st.fillColor; lineColor=st.lineColor; fillOpacity=st.opacity; noBorder=st.noBorder; angle=st.angle; radius=st.radius; shape=st.shape; }
      allCatValues.add(catVal);
    }
    let coords = null;
    if (!isNaN(azimuth) && azimuth !== null) {
      const points = makeSectorPoints(lat, lng, azimuth, angle/2, radius, 40, shape);
      coords = points.map(p => `${p[1]},${p[0]},5`).join(' ');
    }
    placemarks.push({label, lat, lng, coords, row, fillColor, lineColor, fillOpacity, noBorder, _area: 0});
    count++;
  });

  if (errors.length > 0) {
    renderErrors(errors);
  } else {
    $('errorSection').style.display = 'none';
  }

  if (count === 0) {alert('没有有效数据'); return;}

  const catArr = [...allCatValues].filter(v => v && v!=='undefined' && v!=='null');
  catArr.sort((a,b) => { const na=parseFloat(a),nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb))return na-nb; return a.localeCompare(b); });
  const styleMap = {};
  catArr.forEach((val, i) => {
    const st = catStyleMap[val] || {fillColor:defFillColor,lineColor:defLineColor,opacity:90};
    styleMap[val] = {id:'diy'+i, polyColor:hexToKmlColor(st.fillColor,st.opacity), lineColor:hexToKmlColor(st.lineColor,100), width:1, noBorder:!!st.noBorder};
  });

  for (const p of placemarks) {
    if (!p.coords) continue;
    const pts = p.coords.split(' ').map(c => { const q = c.split(','); return [parseFloat(q[0]), parseFloat(q[1])]; });
    let s = 0;
    for (let i = 0; i < pts.length - 1; i++) s += pts[i][0]*pts[i+1][1] - pts[i+1][0]*pts[i][1];
    p._area = Math.abs(s) / 2;
  }

  let kml = '<?xml version="1.0" encoding="utf-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document>';
  const defaultPolyColor = hexToKmlColor(defFillColor, 90);
  const defaultBorderColor = hexToKmlColor(defLineColor, 100);
  const showDefaultBorder = $('showBorder').checked;
  kml += `<Style id="defaultStyle">${showDefaultBorder?`<LineStyle><width>1</width><color>${defaultBorderColor}</color></LineStyle>`:''}<PolyStyle>${showDefaultBorder?'':'<outline>0</outline>'}<color>${defaultPolyColor}</color></PolyStyle></Style>`;
  for (const val in styleMap) { const s=styleMap[val]; kml+=`<Style id="${s.id}">${s.noBorder?'':`<LineStyle><width>${s.width}</width><color>${s.lineColor}</color></LineStyle>`}<PolyStyle>${s.noBorder?'<outline>0</outline>':''}<color>${s.polyColor}</color></PolyStyle></Style>`; }
  kml += '<Style id="btsname"><IconStyle><Icon /></IconStyle><LabelStyle><scale>0.6</scale><color>FFc0ffff</color></LabelStyle></Style>';
  kml += '<Folder><name>基站名称</name>';
  placemarks.forEach(p => { kml+=`<Placemark><name>${esc(p.label)}</name><styleUrl>#btsname</styleUrl><Point><extrude>1</extrude><altitudeMode>clampToGround</altitudeMode><coordinates>${p.lng},${p.lat},5</coordinates></Point></Placemark>`; });
  kml += '</Folder><Folder><name>基站扇区</name>';
  placemarks.sort((a, b) => (b._area || 0) - (a._area || 0));
  placemarks.forEach(p => {
    let desc="<![CDATA[<table width='300' border='1'>"; selectedCols.forEach(col=>{desc+=`<tr><th scope="col">${esc(col)}</th><th scope="col">${esc(String(p.row[col]||''))}</th></tr>`;}); desc+='</table>]]>';
    let styleUrl='<styleUrl>#defaultStyle</styleUrl>';
    if(enableCategory&&categoryCol){const cv=String(p.row[categoryCol]||'');if(styleMap[cv])styleUrl=`<styleUrl>#${styleMap[cv].id}</styleUrl>`;}
    if(p.coords) kml+=`<Placemark><name>${esc(p.label)}</name><description>${desc}</description>${styleUrl}<Polygon><extrude>1</extrude><altitudeMode>clampToGround</altitudeMode><outerBoundaryIs><LinearRing><coordinates>${p.coords}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`;
    else kml+=`<Placemark><name>${esc(p.label)}</name><description>${desc}</description>${styleUrl}<Point><extrude>1</extrude><altitudeMode>clampToGround</altitudeMode><coordinates>${p.lng},${p.lat},5</coordinates></Point></Placemark>`;
  });
  kml += '</Folder></Document></kml>';

  const sheetName = $('sheetSelect').value || 'Sheet1';
  const fileName = (sourceFileName || 'layer_export') + '_' + sheetName + '.kml';
  lastKmlData = { text: kml, name: fileName, size: new Blob([kml]).size };
  $('statusLeft').textContent = '已生成 KML，' + count + ' 个要素，可导出或同步';
}

function exportKML() {
  if (!lastKmlData) {alert('请先点击「生成 KML」'); return;}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lastKmlData.text],{type:'application/vnd.google-earth.kml+xml'}));
  a.download = lastKmlData.name; a.click(); URL.revokeObjectURL(a.href);

  ).join('');
}

const STORAGE_KEY = 'layerToolConfigs';
function getSavedConfigs() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; } }

function refreshConfigSelect() {
  const sel = $('savedConfigSelect'), cur = sel.value;
  sel.innerHTML = '<option value="">-- 选择已保存配置 --</option>';
  Object.keys(getSavedConfigs()).sort().forEach(n => { const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); });

function saveConfigToStorage() {
  const name = $('configNameInput').value.trim();
  if (!name) { alert('请输入配置名称'); return; }
  const configs = getSavedConfigs();
  if (configs[name] && !confirm(`配置 "${name}" 已存在，是否覆盖？`)) return;
  configs[name] = collectConfig();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(configs));
  refreshConfigSelect(); $('savedConfigSelect').value = name; $('configNameInput').value = '';
  $('statusLeft').textContent = '已保存配置: ' + name;
}

function loadSavedConfig() {
  const name = $('savedConfigSelect').value;
  if (!name) { alert('请选择一个配置'); return; }
  const configs = getSavedConfigs();
  if (!configs[name]) { alert('配置不存在'); return; }
  applyConfig(configs[name]); $('configNameInput').value = name;
  $('statusLeft').textContent = '已加载配置: ' + name;
}

function deleteSavedConfig() {
  const name = $('savedConfigSelect').value;
  if (!name) { alert('请选择一个配置'); return; }
  if (!confirm(`确定删除配置 "${name}"？`)) return;
  const configs = getSavedConfigs(); delete configs[name];

  refreshConfigSelect(); $('configNameInput').value = '';
  $('statusLeft').textContent = '已删除配置: ' + name;
}

function collectConfig() {
  const config = {
    version: 1,
    fieldMapping: { labelCol:$('labelCol').value, lngCol:$('lngCol').value, latCol:$('latCol').value, azimuthCol:$('azimuthCol').value },
    sectorStyle: { shape:$('defaultShape').value, angle:parseInt($('sectorAngle').value), radius:parseInt($('sectorRadius').value), fillColor:$('defaultFillColor').value, lineColor:$('defaultLineColor').value, showBorder:$('showBorder').checked },
    category: { column:$('categoryCol').value, rows:[] }
  };
  document.querySelectorAll('#categoryStyles .cat-item').forEach(row => {
    const vs = row.querySelector('.cat-val-select');
    if (!vs || !vs.value) return;
    config.category.rows.push({
      value:vs.value, shape:row.querySelector('.cat-shape')?.value||'sector',
      angle:parseInt(row.querySelector('.cat-angle')?.value)||40, radius:parseInt(row.querySelector('.cat-radius')?.value)||80,
      fillColor:row.querySelector('.cat-fill-color')?.value||'#7c8cf8', lineColor:row.querySelector('.cat-line-color')?.value||'#f87171',
      borderStyle:row.querySelector('.cat-fill-style')?.value||'solid', opacity:parseInt(row.querySelector('.cat-opacity')?.value)||90
    });
  });
  return config;
}

function exportConfig() {

  a.download = 'layer_config.json'; a.click(); URL.revokeObjectURL(a.href);

function importConfig(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { try { applyConfig(JSON.parse(ev.target.result)); $('statusLeft').textContent = '已导入配置: ' + file.name; } catch(err) { alert('配置文件格式错误: ' + err.message); } };
  reader.readAsText(file); e.target.value = '';
}

function applyConfig(config) {
  if (config.fieldMapping && currentHeaders.length > 0) {
    const fm = config.fieldMapping;
    if (fm.labelCol && currentHeaders.includes(fm.labelCol)) $('labelCol').value = fm.labelCol;
    if (fm.lngCol && currentHeaders.includes(fm.lngCol)) $('lngCol').value = fm.lngCol;
    if (fm.latCol && currentHeaders.includes(fm.latCol)) $('latCol').value = fm.latCol;
    if (fm.azimuthCol && currentHeaders.includes(fm.azimuthCol)) $('azimuthCol').value = fm.azimuthCol;
  }
  if (config.sectorStyle) {
    const s = config.sectorStyle;
    if (s.shape) $('defaultShape').value = s.shape;
    if (s.angle !== undefined) { $('sectorAngle').value = s.angle; $('sectorAngleInput').value = s.angle; }
    if (s.radius !== undefined) { $('sectorRadius').value = s.radius; $('sectorRadiusInput').value = s.radius; }
    if (s.fillColor) $('defaultFillColor').value = s.fillColor;
    if (s.lineColor) $('defaultLineColor').value = s.lineColor;
    if (s.showBorder !== undefined) $('showBorder').checked = s.showBorder;
  }
  if (config.category) {
    const catCol = $('categoryCol');
    if (config.category.column && currentHeaders.includes(config.category.column)) {
      catCol.value = config.category.column; onCategoryColChange();
      if (config.category.rows && Array.isArray(config.category.rows)) {
        const allVals = getCatFieldValues();
        config.category.rows.forEach(rd => {
          if (!allVals.includes(rd.value)) return;
          const idx = catRowCount++;
          const div = document.createElement('div');
          div.className = 'cat-item'; div.dataset.idx = idx;
          div.innerHTML = `
            <select class="cat-val-select" data-idx="${idx}"><option value="${esc(rd.value)}">${esc(rd.value)}</option></select>
            <label>形状</label><select class="cat-shape" data-idx="${idx}"><option value="sector"${rd.shape==='sector'?' selected':''}>扇形</option><option value="sword"${rd.shape==='sword'?' selected':''}>剑形</option><option value="triangle"${rd.shape==='triangle'?' selected':''}>三角形</option></select>
            <label>角度</label><input type="number" class="cat-angle" data-idx="${idx}" value="${rd.angle||40}" min="0" max="90" step="5" />
            <label>半径</label><input type="number" class="cat-radius" data-idx="${idx}" value="${rd.radius||80}" min="0" max="150" step="5" />
            <span class="sep"></span>
            <label>填充</label><input type="color" class="cat-fill-color" data-idx="${idx}" value="${rd.fillColor||'#7c8cf8'}" />
            <label>边框</label><input type="color" class="cat-line-color" data-idx="${idx}" value="${rd.lineColor||'#f87171'}" />
            <select class="cat-fill-style" data-idx="${idx}"><option value="solid"${rd.borderStyle==='solid'?' selected':''}>实线</option><option value="no-border"${rd.borderStyle==='no-border'?' selected':''}>无边框</option></select>
            <label>透明</label><input type="number" class="cat-opacity" data-idx="${idx}" value="${rd.opacity||90}" min="0" max="100" step="5" />
            <button class="cat-del" data-idx="${idx}">×</button>`;
          $('categoryStyles').appendChild(div);
          div.querySelector('.cat-del').onclick = () => div.remove();
        });
      }
    } else if (!config.category.column) { catCol.value = ''; onCategoryColChange(); }
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const CLOUD_DB_NAME = 'ov-map-cloud';
const CLOUD_DB_VERSION = 1;
const CLOUD_STORE = 'kml-files';
let cloudDb = null;

function initCloudDb() {
  return new Promise(resolve => {
    const req = indexedDB.open(CLOUD_DB_NAME, CLOUD_DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(CLOUD_STORE)) db.createObjectStore(CLOUD_STORE, { keyPath: 'id' });
    };
    req.onsuccess = e => { cloudDb = e.target.result; resolve(); };
    req.onerror = () => resolve();
  });
}

initCloudDb();

async function compressGzip(str) {
  const encoder = new TextEncoder();
  const data = encoder.encode(str);
  const cs = new CompressionStream('gzip');
  const writer = cs.writable.getWriter();
  writer.write(data);
  writer.close();
  const reader = cs.readable.getReader();
  const chunks = [];
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
  }
  const length = chunks.reduce((s, c) => s + c.length, 0);
  const result = new Uint8Array(length);
  let offset = 0;
  for (const chunk of chunks) {
    result.set(chunk, offset);
    offset += chunk.length;
  }
  return result;
}

async function compressedPost(url, bodyObj, onProgress) {
  const json = JSON.stringify(bodyObj);
  const compressed = await compressGzip(json);
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Content-Encoding', 'gzip');
    xhr.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total); };
    xhr.onload = () => resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, json: () => JSON.parse(xhr.responseText) });
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(compressed);
  });
}

$('btnSyncCloud').addEventListener('click', async () => {
  if (!lastKmlData) { alert('请先点击「生成 KML」'); return; }

  const savedApi = localStorage.getItem('ov-map-cloud-api') || '';
  const input = prompt('请输入后端 API 地址（如 http://localhost:3000）\n留空则保存到浏览器数据', savedApi);
  if (input === null) return;

  const apiUrl = input.trim().replace(/\/+$/, '');
  if (!apiUrl) {
    if (!cloudDb) { alert('本地存储未就绪，请稍后重试'); return; }
    const overlay = $('loadingOverlay');
    overlay.querySelector('.loading-text').textContent = '正在保存到浏览器...';
    overlay.classList.add('show');
    try {
      const id = 'cloud_' + Date.now();
      const tx = cloudDb.transaction(CLOUD_STORE, 'readwrite');
      tx.objectStore(CLOUD_STORE).put({
        id,
        name: lastKmlData.name,
        text: lastKmlData.text,
        ext: 'kml',
        size: lastKmlData.size,
        enabled: true,
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
      tx.oncomplete = () => {
        overlay.classList.remove('show');
        $('statusLeft').textContent = '已保存到浏览器: ' + lastKmlData.name;
        alert('已保存到浏览器数据，可在主页面「云端同步」中导入');
      };
      tx.onerror = () => { overlay.classList.remove('show'); alert('保存失败'); };
    } catch (err) {
      overlay.classList.remove('show');
      alert('保存失败: ' + err.message);
    }
    return;
  }

  const overlay = $('loadingOverlay');
  overlay.querySelector('.loading-text').textContent = '正在连接后端...';
  overlay.classList.add('show');

  localStorage.setItem('ov-map-cloud-api', apiUrl);
  try {
    const resp = await fetch(apiUrl + '/api/health', { signal: AbortSignal.timeout(3000) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (!data || data.status !== 'ok') throw new Error('服务状态异常');
  } catch (e) {
    overlay.classList.remove('show');
    alert('无法连接后端: ' + e.message);
    return;
  }

  overlay.querySelector('.loading-text').textContent = '正在上传...';
  try {
    const uploadResp = await compressedPost(apiUrl + '/api/files', {
      name: lastKmlData.name,
      text: lastKmlData.text,
      ext: 'kml'
    }, (loaded, total) => {
      const pct = Math.round((loaded / total) * 100);
      overlay.querySelector('.loading-text').textContent = `正在上传... ${pct}%`;
    });
    overlay.classList.remove('show');
    if (uploadResp.ok) {
      $('statusLeft').textContent = '已同步到后端: ' + lastKmlData.name;
      alert('已同步到后端服务器，可在主页面「云端同步」中导入');
    } else {
      let msg = 'HTTP ' + uploadResp.status;
      if (uploadResp.status === 413) {
        msg = '文件过大，Cloudflare CDN 限制上传大小，请使用源站地址直连（绕过 CDN）';
      } else {
        const err = await uploadResp.json().catch(() => ({}));
        if (err.error) msg = err.error;
      }
      alert('同步失败: ' + msg);
    }
  } catch (e) {
    overlay.classList.remove('show');
    alert('同步失败: ' + e.message);
  }
});
</script>
