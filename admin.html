<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · OV Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%232c3e50'/><circle cx='32' cy='32' r='20' fill='%23e74c3c'/><text x='32' y='40' text-anchor='middle' fill='white' font-size='24' font-weight='bold'>A</text></svg>">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">&#9881;</div>
                <h2>管理后台</h2>
                <p>网页版奥维地图</p>
            </div>
            <form id="loginForm" onsubmit="return Admin.login(event)">
                <div class="form-group">
                    <label for="password">管理密码</label>
                    <input type="password" id="password" placeholder="请输入管理密码" autocomplete="current-password" required>
                </div>
                <div id="loginError" class="login-error" style="display:none">密码错误</div>
                <button type="submit" class="btn-login">登 录</button>
            </form>
            <div class="login-hint">
                <a href="index.html">&larr; 返回地图</a>
            </div>
        </div>
    </div>

    <div id="adminPage" class="admin-page" style="display:none">
        <div class="admin-header">
            <div class="admin-header-left">
                <h1>&#9881; 管理后台</h1>
                <span class="admin-subtitle">KML 图层管理</span>
            </div>
            <div class="admin-header-right">
                <a href="index.html" class="btn-header">&larr; 返回地图</a>
                <button class="btn-header btn-logout" onclick="Admin.logout()">退出登录</button>
            </div>
        </div>

        <div class="admin-content">
            <div class="admin-section">
                <div class="section-header">
                    <h3>上传文件到云端</h3>
                </div>
                <div class="upload-area" id="cloudUploadArea">
                    <div class="upload-icon">&#9729;</div>
                    <p>拖拽 KML 文件到此处，或点击选择文件上传到云端</p>
                    <input type="file" id="cloudKmlInput" accept=".kml" multiple style="display:none">
                    <button class="btn btn-primary" onclick="document.getElementById('cloudKmlInput').click()">选择 KML 文件</button>
                </div>
                <div id="cloudUploadProgress" class="upload-progress" style="display:none">
                    <div class="progress-bar"><div class="progress-fill" id="cloudProgressFill"></div></div>
                    <span id="cloudProgressText">上传中...</span>
                </div>
            </div>

            <div class="admin-section">
                <div class="section-header">
                    <h3>文件管理</h3>
                    <div class="section-actions">
                        <span id="fileCount" class="file-count"></span>
                        <button class="btn btn-small btn-primary" onclick="Admin.refreshList()">&#8635; 刷新</button>
                    </div>
                </div>
                <div class="source-tabs" id="typeTabs">
                    <button class="source-tab active" data-type="kml" onclick="Admin.switchType('kml')">KML 文件</button>
                    <button class="source-tab" data-type="config" onclick="Admin.switchType('config')">图层配置</button>
                </div>
                <div class="source-tabs" id="sourceTabs">
                    <button class="source-tab active" data-source="remote" onclick="Admin.switchSource('remote')">云端</button>
                    <button class="source-tab" data-source="local" onclick="Admin.switchSource('local')">本地</button>
                </div>
                <div class="api-inline-bar" id="apiBar">
                    <input type="text" id="remoteApiInput" placeholder="后端 API 地址，如 http://localhost:3000" />
                    <button class="btn btn-small btn-primary" onclick="Admin.connectRemoteApi()">连接</button>
                </div>
                <div id="remoteApiStatus" class="api-inline-status"></div>
                <div class="upload-area" id="uploadArea" style="display:none">
                    <div class="upload-icon">&#128228;</div>
                    <p>拖拽 KML 文件到此处，或点击选择文件</p>
                    <input type="file" id="kmlFileInput" accept=".kml" multiple style="display:none">
                    <button class="btn btn-primary" onclick="document.getElementById('kmlFileInput').click()">选择 KML 文件</button>
                </div>
                <div id="uploadProgress" class="upload-progress" style="display:none">
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                    <span id="progressText">上传中...</span>
                </div>
                <div id="fileListContainer" class="file-list"></div>
            </div>

            <div class="admin-section">
                <div class="section-header">
                    <h3>设置</h3>
                </div>
                <div class="settings-group">
                    <div class="setting-item">
                        <label>管理密码</label>
                        <div class="setting-row">
                            <input type="password" id="newPassword" placeholder="修改管理密码">
                            <button class="btn btn-small btn-primary" onclick="Admin.changePassword()">修改</button>
                        </div>
                        <p class="setting-hint">默认密码: admin123</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="fileModal" class="modal-overlay" style="display:none">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">文件详情</span>
                <button class="modal-close" onclick="Admin.closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <div id="toast" class="toast" style="display:none"></div>

    <button class="page-theme-toggle" onclick="toggleTheme()" title="切换明暗主题">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <script src="js/utils.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
